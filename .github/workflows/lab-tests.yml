name: project-model-tests

on:
  push:
    paths:
      - "labs/**"
      - "tools/**"
      - ".github/workflows/lab-tests.yml"
  pull_request:
    paths:
      - "labs/**"
      - "tools/**"
      - ".github/workflows/lab-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test labs/*/core.test.mjs tools/*/core.test.mjs
