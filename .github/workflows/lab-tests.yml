name: lab-tests

on:
  push:
    paths:
      - "labs/**"
      - ".github/workflows/lab-tests.yml"
  pull_request:
    paths:
      - "labs/**"
      - ".github/workflows/lab-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test labs/syncbench/core.test.mjs labs/rampwatch/core.test.mjs
