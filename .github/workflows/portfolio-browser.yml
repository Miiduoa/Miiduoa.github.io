name: Portfolio browser checks

on:
  push:
    branches: [main]
    paths: ['index.html', 'home.css', 'home.js', 'assets/**', 'tests/portfolio_browser.py', '.github/workflows/portfolio-browser.yml']
  pull_request:
    paths: ['index.html', 'home.css', 'home.js', 'assets/**', 'tests/portfolio_browser.py', '.github/workflows/portfolio-browser.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install browser test dependency
        run: python3 -m pip install playwright==1.57.0
      - name: Install Chromium
        run: python3 -m playwright install --with-deps chromium
      - name: Check layout, source images, keyboard, and gallery
        run: python3 tests/portfolio_browser.py
      - name: Keep rendered screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portfolio-browser-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
